<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Planet Core -->
  <g transform="translate(10, 10)">
    <!-- Back ring -->
    <path d="M 2 28 C 15 15, 60 14, 76 25" stroke="#111827" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.3"/>
    
    <!-- Planet body -->
    <circle cx="38" cy="30" r="21" fill="#111827" />
    <circle cx="33" cy="25" r="18" fill="#1f2937" />
    
    <!-- Shading crescent -->
    <path d="M 38 9 A 21 21 0 0 1 54 39 A 21 21 0 0 0 38 9" fill="#0f172a" />
    
    <!-- Front tilted ring with star/sparkle -->
    <ellipse cx="38" cy="30" rx="34" ry="11" transform="rotate(-26 38 30)" stroke="#111827" stroke-width="5" fill="none" stroke-linecap="round"/>
    
    <!-- Sparkle on upper-left ring -->
    <polygon points="12,18 14,24 20,26 14,28 12,34 10,28 4,26 10,24" fill="#f59e0b" />
    <circle cx="12" cy="26" r="1.5" fill="#ffffff" />
  </g>
  
  <!-- Typography B&F -->
  <text x="96" y="55" font-family="'Cinzel', 'Playfair Display', 'Cinzel Decorative', Georgia, serif" font-size="46" font-weight="800" letter-spacing="2" fill="#111827">B&amp;F</text>
  
  <!-- Subtle tagline -->
  <text x="98" y="70" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="700" letter-spacing="4" fill="#64748b">TEXTIL &amp; DOTACIONES</text>
</svg>
